:root {
  --bg: #f7f8fa; --panel: #ffffff; --border: #e3e5e8; --text: #1a1a1a; --muted: #6b7280;
  --accent: #2563eb; --accent-soft: #e8efff; --green: #16a34a; --green-soft: #e6f6ec;
  --yellow: #d97706; --yellow-soft: #fff4e0; --red: #dc2626; --red-soft: #fdeaea;
  --code-bg: #f1f3f5; --topbar: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1a1a; --panel: #262626; --border: #3a3a3a; --text: #eaeaea; --muted: #9aa0a6;
  --accent: #60a5fa; --accent-soft: #1f2a44; --green: #4ade80; --green-soft: #13301f;
  --yellow: #fbbf24; --yellow-soft: #3a2d10; --red: #f87171; --red-soft: #3b1a1a;
  --code-bg: #1f1f1f; --topbar: #282828; --shadow: none;
 color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1a1a1a; --panel: #262626; --border: #3a3a3a; --text: #eaeaea; --muted: #9aa0a6;
  --accent: #60a5fa; --accent-soft: #1f2a44; --green: #4ade80; --green-soft: #13301f;
  --yellow: #fbbf24; --yellow-soft: #3a2d10; --red: #f87171; --red-soft: #3b1a1a;
  --code-bg: #1f1f1f; --topbar: #282828; --shadow: none;
 color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; cursor: pointer; }
code, pre, .mono { font-family: var(--mono); }
.hidden { display: none !important; }

#topbar { height: 48px; display: flex; align-items: center; gap: 8px; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--topbar); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#topbar .brand { font-weight: 700; font-size: 16px; color: var(--text); margin-right: 16px; }
#topbar .brand span { color: var(--yellow); }
#topbar nav { display: flex; gap: 4px; }
#topbar nav a { color: var(--muted); padding: 6px 10px; border-radius: 6px; font-weight: 500; }
#topbar nav a.active, #topbar nav a:hover { color: var(--text); background: var(--accent-soft); }
#topbar .spacer { flex: 1; }
#mock-timer { font-family: var(--mono); font-weight: 600; padding: 4px 10px; border-radius: 6px; background: var(--yellow-soft); color: var(--yellow); }
#mock-timer.late { background: var(--red-soft); color: var(--red); }
.icon-btn { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 8px; }
.icon-btn:hover { background: var(--accent-soft); }

main { flex: 1; min-height: 0; overflow: auto; }
.page { max-width: 1100px; margin: 0 auto; padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page h1 { font-size: 24px; margin: 0 0 6px; }
.page h2 { font-size: 18px; margin: 28px 0 10px; }
.page p.lead { color: var(--muted); margin: 0 0 16px; max-width: 760px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 14px; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 800px) { .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }
.stat { font-size: 28px; font-weight: 700; }
.stat small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.easy > i { background: var(--green); } .bar.medium > i { background: var(--yellow); } .bar.hard > i { background: var(--red); }
.row { display: flex; align-items: center; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--code-bg); color: var(--muted); }
.pill.easy { background: var(--green-soft); color: var(--green); }
.pill.medium { background: var(--yellow-soft); color: var(--yellow); }
.pill.hard { background: var(--red-soft); color: var(--red); }
.pill.company { background: var(--accent-soft); color: var(--accent); }
.pill.company.google { background: #e8f0fe; color: #1a56db; }
.pill.company.apple { background: #ececec; color: #333; }
:root[data-theme="dark"] .pill.company.google { background: #1f2a44; color: #8ab4f8; }
:root[data-theme="dark"] .pill.company.apple { background: #3a3a3a; color: #ddd; }

.btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; font-weight: 500; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

/* problem list */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.filters input, .filters select { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
.filters input { min-width: 220px; }
table.plist { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
table.plist th, table.plist td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
table.plist th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
table.plist tr:last-child td { border-bottom: 0; }
table.plist tbody tr:hover { background: var(--accent-soft); }
table.plist td.status { width: 36px; text-align: center; }
.st-solved { color: var(--green); } .st-attempted { color: var(--yellow); }
.star { cursor: pointer; color: var(--muted); } .star.on { color: var(--yellow); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }

/* problem page */
.workspace { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 48px); }
@media (max-width: 900px) { .workspace { grid-template-columns: 1fr; height: auto; } .workspace .pane { height: auto; min-height: 50vh; } }
.pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--panel); }
.pane:last-child { border-right: 0; }
.pane-tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; align-items: center; }
.pane-tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 10px; font-weight: 500; }
.pane-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.pane-tabs .spacer { flex: 1; }
.pane-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; }
.ptitle { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
.desc p { line-height: 1.6; margin: 0 0 12px; }
.desc code, .md code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.desc pre, .md pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow: auto; font-size: 13px; line-height: 1.5; }
.desc pre code, .md pre code { background: transparent; padding: 0; }
.md h3, .md h2 { font-size: 15px; margin: 18px 0 6px; }
.md ul, .md ol { padding-left: 22px; line-height: 1.6; }
.md p { line-height: 1.6; margin: 0 0 12px; }
.example { background: var(--code-bg); border-radius: 6px; padding: 10px 12px; margin: 8px 0 14px; font-size: 13px; }
.example b { display: inline-block; min-width: 86px; }
.example div { margin: 2px 0; }
details.hint { margin: 6px 0; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
details.hint summary { cursor: pointer; font-weight: 500; color: var(--accent); }
.sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
ul.similar { padding-left: 0; list-style: none; }
ul.similar li { padding: 4px 0; }
.editor-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.editor-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-shrink: 0; }
.editor-toolbar .spacer { flex: 1; }
.CodeMirror { flex: 1; height: auto; min-height: 0; font-family: var(--mono); font-size: 13px; line-height: 1.5; }
.editor-wrap > .CodeMirror { height: 100%; }
textarea.plain-editor { flex: 1; font-family: var(--mono); font-size: 13px; padding: 10px; border: 0; background: var(--panel); color: var(--text); resize: none; outline: none; }
.console { height: 38%; min-height: 180px; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.console .pane-body { padding: 10px 14px; }
.case-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.case-tabs button { background: var(--code-bg); border: 0; border-radius: 6px; padding: 4px 10px; color: var(--muted); }
.case-tabs button.active { background: var(--accent-soft); color: var(--text); }
.case-tabs button.pass { color: var(--green); } .case-tabs button.fail { color: var(--red); }
.kv { margin: 6px 0; }
.kv label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.kv pre, .kv textarea { margin: 0; background: var(--code-bg); border-radius: 6px; padding: 8px 10px; font-size: 13px; width: 100%; border: 0; color: var(--text); font-family: var(--mono); }
.kv textarea { min-height: 54px; resize: vertical; }
.verdict { font-size: 18px; font-weight: 700; margin: 4px 0 8px; }
.verdict.ok { color: var(--green); } .verdict.bad { color: var(--red); }
.verdict small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.runbar { display: flex; gap: 8px; align-items: center; }
.stopwatch { font-family: var(--mono); font-size: 12px; min-width: 56px; text-align: center; }
.rate { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
.sub-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; align-items: center; }
.sub-row .ok { color: var(--green); font-weight: 600; } .sub-row .bad { color: var(--red); font-weight: 600; }
textarea.note { width: 100%; min-height: 220px; font: inherit; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }

/* plan and tracks */
details.week { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; margin-bottom: 10px; }
details.week summary { cursor: pointer; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; }
details.week summary .pill { margin-left: auto; }
.day { margin: 10px 0; }
.day h4 { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
.day ul { margin: 0; padding-left: 0; list-style: none; }
.day li { padding: 3px 0; display: flex; gap: 8px; align-items: center; }
ol.steps { line-height: 1.6; padding-left: 20px; }
ul.plain { line-height: 1.6; padding-left: 20px; }
.track-list li { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); }
.track-list { list-style: none; padding: 0; margin: 0; }
.score { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 26px; }
.mix { display: grid; grid-template-columns: 180px 1fr 40px; gap: 6px 10px; align-items: center; font-size: 13px; }
.notice { background: var(--yellow-soft); color: var(--text); border-left: 3px solid var(--yellow); padding: 8px 12px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
.heat { display: grid; grid-template-columns: repeat(30, 10px); gap: 3px; }
.heat i { width: 10px; height: 10px; border-radius: 2px; background: var(--border); display: block; }
.heat i.on { background: var(--green); }
kbd { font-family: var(--mono); font-size: 11px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

html, body { height: 100%; }
.pane-body, .page { min-width: 0; }

</style>

  <a class="brand" href="#/">Kaizen<span>Prep</span></a>
  <nav>
    <a href="#/" data-nav="/">Dashboard</a>
    <a href="#/problems" data-nav="/problems">Problems</a>
    <a href="#/plan" data-nav="/plan">Study plan</a>

  </nav>
  <div class="spacer"></div>

<script>
/* In-browser replacement for server.py: same URL contract, data from static JSON files,
   progress in localStorage, judging in a Pyodide Web Worker. Loaded before app.js. */
(function () {
  const TIMEOUT_MS = 12000;
  const PKEY = 'prepcode:progress';
  let index = null, tracksData = null, patternsData = null;
  const problemCache = {};

  const fetchJson = (u) => fetch(u).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
  async function loadIndex() {
    if (!index) {
      [index, tracksData, patternsData] = await Promise.all([fetchJson('data/index.json'), fetchJson('data/tracks.json'), fetchJson('data/patterns.json')]);
    }
    return index;
  }
  async function loadProblem(id) {
    if (!problemCache[id]) problemCache[id] = await fetchJson('data/problems/' + id + '.json');
    return problemCache[id];
  }

  // ---------- progress ----------
  function loadProgress() { try { return JSON.parse(localStorage.getItem(PKEY)) || { problems: {}, submissions: [] }; } catch { return { problems: {}, submissions: [] }; } }
  function saveProgress(d) { try { localStorage.setItem(PKEY, JSON.stringify(d)); } catch {} }
  const today = () => new Date().toISOString().slice(0, 10);
  const plusDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const nowIso = () => new Date().toISOString().slice(0, 19);
  const INTERVALS = () => (tracksData && tracksData.intervals) || [1, 3, 7, 14, 30, 60];

  function recordSubmission(pid, code, result) {
    const data = loadProgress();
    const p = data.problems[pid] = data.problems[pid] || {};
    const accepted = result.status === 'Accepted';
    p.attempts = (p.attempts || 0) + 1; p.last_status = result.status; p.last_at = nowIso();
    if (accepted) {
      const level = p.level || 0; const iv = INTERVALS();
      p.level = level + 1; p.status = 'solved'; p.solved_at = p.solved_at || today();
      p.next_review = plusDays(iv[Math.min(level, iv.length - 1)]); p.accepted_code = code;
    } else if (p.status === 'solved') { p.level = Math.max(0, (p.level || 1) - 1); p.next_review = plusDays(1); }
    else p.status = 'attempted';
    p.draft = code;
    data.submissions.push({ id: pid, status: result.status, passed: result.passed, total: result.total, ms: result.ms, at: p.last_at, code });
    data.submissions = data.submissions.slice(-500);
    saveProgress(data);
    return p;
  }
  function rateReview(pid, rating) {
    const data = loadProgress(); const p = data.problems[pid] = data.problems[pid] || {}; const iv = INTERVALS();
    let level = p.level || 0;
    if (rating === 'again') level = 0; else if (rating === 'hard') level = Math.max(0, level - 1); else if (rating === 'easy') level += 1;
    p.level = level; p.next_review = plusDays(iv[Math.min(level, iv.length - 1)]); saveProgress(data); return p;
  }
  function stats(problems) {
    const data = loadProgress(); const prog = data.problems;
    const by_difficulty = { Easy: [0, 0], Medium: [0, 0], Hard: [0, 0] }; const by_pattern = {};
    let solved = 0, attempted = 0;
    for (const p of problems) {
      const e = prog[p.id] || {}; by_difficulty[p.difficulty][1]++; (by_pattern[p.pattern] = by_pattern[p.pattern] || [0, 0])[1]++;
      if (e.status === 'solved') { solved++; by_difficulty[p.difficulty][0]++; by_pattern[p.pattern][0]++; } else if (e.status === 'attempted') attempted++;
    }
    const days = new Set(data.submissions.filter(s => s.status === 'Accepted').map(s => s.at.slice(0, 10)));
    let streak = 0; const d = new Date(); if (!days.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
    while (days.has(d.toISOString().slice(0, 10))) { streak++; d.setDate(d.getDate() - 1); }
    return { solved, attempted, total: problems.length, by_difficulty, by_pattern, streak, active_days: [...days].sort().slice(-120) };
  }
  function dueReviews(problems) {
    const prog = loadProgress().problems; const t = today();
    return problems.filter(p => { const e = prog[p.id]; return e && e.status === 'solved' && (e.next_review || '9999') <= t; })
      .map(p => ({ id: p.id, title: p.title, difficulty: p.difficulty, pattern: p.pattern, due: prog[p.id].next_review })).sort((a, b) => a.due < b.due ? -1 : 1);
  }

  // ---------- tracks and plan ----------
  const DIFF = { Easy: 0, Medium: 1, Hard: 2 };
  function companyTrack(problems, company) {
    const g = tracksData.guides[company]; const byId = Object.fromEntries(problems.map(p => [p.id, p]));
    const must = g.must_do.map(i => byId[i]).filter(Boolean); const mustIds = new Set(must.map(p => p.id));
    const sc = (p) => (p.companies || {})[company] || 0;
    const rest = problems.filter(p => sc(p) >= 3 && !mustIds.has(p.id)).sort((a, b) => sc(b) - sc(a) || DIFF[a.difficulty] - DIFF[b.difficulty] || a.number - b.number);
    const freq = problems.filter(p => sc(p) >= 1).sort((a, b) => sc(b) - sc(a) || a.number - b.number);
    const prog = loadProgress().problems;
    const brief = (p) => ({ id: p.id, number: p.number, title: p.title, difficulty: p.difficulty, pattern: p.pattern, score: sc(p), status: (prog[p.id] || {}).status });
    const weight = {}; for (const p of freq) weight[p.pattern] = (weight[p.pattern] || 0) + sc(p);
    const total = Object.values(weight).reduce((a, b) => a + b, 0) || 1;
    const pattern_mix = Object.entries(weight).map(([pattern, v]) => ({ pattern, share: Math.round(100 * v / total) })).sort((a, b) => b.share - a.share);
    return { company, name: g.name, summary: g.summary, process: g.process, focus: g.focus, tips: g.tips, must_do: must.map(brief), also: rest.map(brief), all_by_frequency: freq.map(brief), pattern_mix };
  }
  function studyPlan(problems) {
    const prog = loadProgress().problems;
    const weeks = tracksData.weeks.map(([title, patterns], wi) => {
      const week = wi + 1;
      const pool = problems.filter(p => patterns.includes(p.pattern)).sort((a, b) => patterns.indexOf(a.pattern) - patterns.indexOf(b.pattern) || DIFF[a.difficulty] - DIFF[b.difficulty] || a.number - b.number);
      const days = [[], [], [], [], [], []];
      pool.forEach((p, i) => days[i % 6].push({ id: p.id, number: p.number, title: p.title, difficulty: p.difficulty, pattern: p.pattern, status: (prog[p.id] || {}).status }));
      const extras = week === 8 ? ['Two full mock interviews (use the Mock tab): one Google-style, one Apple-style.', "Re-solve every problem marked 'again' or 'hard' in reviews.", 'Write out your 6 behavioural STAR stories and rehearse them aloud.'] : week === 5 ? ['Mid-point mock interview: one graph problem, 45 minutes, no hints.'] : [];
      return { week, title, patterns, days, extras, done: days.flat().filter(p => p.status === 'solved').length, total: pool.length };
    });
    return { weeks, daily_routine: ['Warm-up (10 min): one review-due problem from the Reviews list, from memory.', 'New problems (60-90 min): the day\'s list. Spend at most 25 minutes before opening a hint, 40 before the editorial.', 'After each problem: read the editorial even if you passed, and write one line in Notes about the key idea.', 'Wrap-up (5 min): re-explain today\'s hardest problem out loud as if to an interviewer.'] };
  }

  // ---------- judge ----------
  let worker = null, seq = 0; const pending = {};
  function getWorker() {
    if (!worker) {
      worker = new Worker('judge-worker.js');
      worker.onmessage = (ev) => { const cb = pending[ev.data.id]; if (cb) { delete pending[ev.data.id]; cb(ev.data); } };
      worker.onerror = (e) => { for (const k of Object.keys(pending)) { pending[k]({ fatal: 'Worker error: ' + e.message }); delete pending[k]; } };
    }
    return worker;
  }
  function execute(code, problem, tests) {
    return new Promise((resolve) => {
      const id = ++seq; const w = getWorker();
      const timer = setTimeout(() => { delete pending[id]; w.terminate(); worker = null; resolve({ timeout: true }); }, TIMEOUT_MS + (seq === 1 ? 30000 : 0));
      pending[id] = (msg) => { clearTimeout(timer); resolve(msg); };
      w.postMessage({ id, code, tests, spec: { kind: problem.kind || 'function', function: problem.function, class_name: problem.class_name, arg_types: problem.arg_types || {}, return_type: problem.return_type || '', output_mode: problem.output_mode || 'return' } });
    });
  }
  const norm = (v, mode) => mode === 'unordered_nested' ? (v || []).map(x => JSON.stringify(Array.isArray(x) ? [...x].sort((a, b) => a < b ? -1 : a > b ? 1 : 0) : x)).sort() : (v || []).map(x => JSON.stringify(x)).sort();
  function compare(expected, actual, mode, tol) {
    tol = tol || 1e-5;
    if (mode === 'any_of') return expected.some(e => compare(e, actual, 'exact', tol));
    if (mode === 'float') { try { if (Array.isArray(expected)) return expected.length === actual.length && expected.every((a, i) => Math.abs(+a - +actual[i]) <= tol); return Math.abs(+expected - +actual) <= tol; } catch { return false; } }
    if (mode === 'unordered' || mode === 'unordered_nested') { const a = norm(expected, mode), b = norm(actual, mode); return a.length === b.length && a.every((x, i) => x === b[i]); }
    return JSON.stringify(expected) === JSON.stringify(actual);
  }
  async function runCode(code, problem, tests) {
    const t0 = performance.now();
    const msg = await execute(code, problem, tests);
    const ms = Math.round(performance.now() - t0);
    if (msg.timeout) return { status: 'Time Limit Exceeded', passed: 0, total: tests.length, cases: [], stderr: 'Execution exceeded ' + (TIMEOUT_MS / 1000) + 's. Check for an infinite loop or an exponential algorithm.', ms };
    if (msg.fatal) return { status: 'Runtime Error', passed: 0, total: tests.length, cases: [], stderr: msg.fatal, ms };
    if (msg.error) return { status: msg.error.includes('SyntaxError') || msg.error.includes('IndentationError') ? 'Compile Error' : 'Runtime Error', passed: 0, total: tests.length, cases: [], stderr: msg.error, stdout: msg.stdout, ms };
    const mode = problem.compare || 'exact'; const cases = []; let passed = 0, status = 'Accepted';
    tests.forEach((t, i) => {
      const r = msg.results[i] || {};
      if (r.ok) { const ok = compare(t.output, r.output, mode, problem.tolerance); passed += ok; cases.push({ input: t.input, expected: t.output, output: r.output, ok, ms: r.ms }); if (!ok && status === 'Accepted') status = 'Wrong Answer'; }
      else { cases.push({ input: t.input, expected: t.output, output: null, ok: false, error: r.error, trace: r.trace }); status = 'Runtime Error'; }
    });
    return { status, passed, total: tests.length, cases, stdout: msg.stdout, ms };
  }
  const visibleTests = (p) => p.tests.slice(0, Math.max(2, Math.min(3, p.examples.length)));

  // ---------- API ----------
  function summary(p, prog) { const e = prog[p.id] || {}; return { ...p, status: e.status, starred: !!e.starred, next_review: e.next_review, attempts: e.attempts || 0 }; }
  async function problemPayload(id) {
    const idx = await loadIndex(); const p = await loadProblem(id); const e = loadProgress().problems[id] || {};
    const byId = Object.fromEntries(idx.problems.map(x => [x.id, x])); const i = p.number - 1;
    const prev = idx.problems[i - 1], next = idx.problems[i + 1];
    const subs = loadProgress().submissions.filter(s => s.id === id).reverse().slice(0, 20);
    return { ...p, similar: (p.similar || []).filter(s => byId[s]).map(s => ({ id: s, title: byId[s].title, difficulty: byId[s].difficulty })), followups: p.followups || [], kind: p.kind || 'function',
      draft: e.draft, note: e.note || '', starred: !!e.starred, status: e.status, level: e.level || 0, next_review: e.next_review,
      visible_tests: visibleTests(p), hidden_count: p.tests.length - visibleTests(p).length, prev: prev ? { id: prev.id, title: prev.title } : null, next: next ? { id: next.id, title: next.title } : null, submissions: subs };
  }

  window.PrepAPI = {
    async get(url) {
      const [path, qs] = url.split('?'); const idx = await loadIndex(); const prog = loadProgress().problems;
      if (path === '/api/problems') return { problems: idx.problems.map(p => summary(p, prog)), patterns: idx.patterns };
      if (path.startsWith('/api/problem/')) return problemPayload(path.split('/')[3]);
      if (path === '/api/stats') return { stats: stats(idx.problems), reviews: dueReviews(idx.problems) };
      if (path === '/api/random') { const un = idx.problems.filter(p => (prog[p.id] || {}).status !== 'solved'); const pool = un.length ? un : idx.problems; return { id: pool[Math.floor(Math.random() * pool.length)].id }; }
      if (path.startsWith('/api/track/')) return companyTrack(idx.problems, path.split('/')[3]);
      if (path === '/api/plan') return studyPlan(idx.problems);
      if (path === '/api/patterns') return patternsData;
      if (path === '/api/mock') { const company = (qs || '').replace('company=', '') || 'google'; const t = companyTrack(idx.problems, company); const pool = [...t.must_do, ...t.also].filter(p => p.difficulty !== 'Easy'); const pick = []; const src = pool.length ? [...pool] : [...t.all_by_frequency]; while (pick.length < 2 && src.length) pick.push(src.splice(Math.floor(Math.random() * src.length), 1)[0]); return { company, problems: pick, minutes: 45 }; }
      return { error: 'unknown endpoint' };
    },
    async post(url, body) {
      const pid = body.id;
      if (url === '/api/run' || url === '/api/submit') {
        const p = await loadProblem(pid); const code = body.code || '';
        if (url === '/api/run') {
          let tests = visibleTests(p); if (body.custom) tests = tests.concat(body.custom.map(c => ({ input: c, output: null })));
          const res = await runCode(code, p, tests); this.post('/api/draft', { id: pid, code });
          for (const c of res.cases) if (c.expected === null) { c.ok = !c.error; c.custom = true; }
          const graded = res.cases.filter(c => !c.custom);
          if (res.cases.length) { if (res.status === 'Wrong Answer' || res.status === 'Accepted') res.status = graded.every(c => c.ok) ? 'Accepted' : 'Wrong Answer'; res.passed = graded.filter(c => c.ok).length; res.total = graded.length; }
          return res;
        }
        const res = await runCode(code, p, p.tests); const entry = recordSubmission(pid, code, res);
        res.entry = { status: entry.status, level: entry.level, next_review: entry.next_review, attempts: entry.attempts }; return res;
      }
      const data = loadProgress(); const e = data.problems[pid] = data.problems[pid] || {};
      if (url === '/api/draft') { e.draft = body.code; e.draft_at = nowIso(); saveProgress(data); return { ok: true }; }
      if (url === '/api/note') { e.note = body.note; saveProgress(data); return { ok: true }; }
      if (url === '/api/star') { e.starred = !e.starred; saveProgress(data); return { starred: e.starred }; }
      if (url === '/api/rate') return rateReview(pid, body.rating || 'hard');
      return { error: 'unknown endpoint' };
    },
    warm() { try { getWorker(); } catch {} },
  };
})();

</script>
<script>
/* KaizenPrep front end: hash-routed single page app, no build step. */
(function () {
  const app = document.getElementById('app');
  const api = window.PrepAPI || {
    get: (u) => fetch(u).then(r => r.json()),
    post: (u, body) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()),
  };
  const STATIC = !!window.PrepAPI;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ---------- theme ----------
  function applyTheme() {
    const t = store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  }
  document.getElementById('theme-btn').onclick = () => {
    store.set('theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    applyTheme();
    if (window._cm) window._cm.setOption('theme', document.documentElement.dataset.theme === 'dark' ? 'material-darker' : 'default');
  };
  applyTheme();

  // ---------- tiny markdown ----------
  function md(src) {
    const lines = String(src || '').split('\n');
    let out = '', i = 0, inList = null;
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
    const closeList = () => { if (inList) { out += `</${inList}>`; inList = null; } };
    while (i < lines.length) {
      const l = lines[i];
      if (l.startsWith('```')) {
        closeList();
        let code = ''; i++;
        while (i < lines.length && !lines[i].startsWith('```')) { code += lines[i] + '\n'; i++; }
        out += `<pre><code>${esc(code)}</code></pre>`; i++; continue;
      }
      const h = l.match(/^(#{1,4})\s+(.*)/);
      if (h) { closeList(); out += `<h3>${inline(h[2])}</h3>`; i++; continue; }
      const ul = l.match(/^\s*[-*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) {
        const tag = ul ? 'ul' : 'ol';
        if (inList !== tag) { closeList(); out += `<${tag}>`; inList = tag; }
        out += `<li>${inline((ul || ol)[1])}</li>`; i++; continue;
      }
      if (l.trim() === '') { closeList(); i++; continue; }
      closeList();
      let para = l; i++;
      while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|```)/.test(lines[i])) { para += ' ' + lines[i]; i++; }
      out += `<p>${inline(para)}</p>`;
    }
    closeList();
    return out;
  }

  // ---------- router ----------
  const routes = [];
  function route(re, fn) { routes.push([re, fn]); }
  let currentRoute = null;
  function go(path) { currentRoute = path; try { if (location.hash !== '#' + path) history.replaceState(null, '', '#' + path); } catch {} render(); }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#/"]'); if (!a) return;
    e.preventDefault(); go(a.getAttribute('href').slice(1));
  });
  async function render() {
    const hash = currentRoute || (location.hash.startsWith('#/') ? location.hash.slice(1) : '/');
    document.title = 'KaizenPrep';
    document.querySelectorAll('#topbar nav a').forEach(a => a.classList.toggle('active', hash === a.dataset.nav || (a.dataset.nav !== '/' && hash.startsWith(a.dataset.nav))));
    if (window._cm) { window._cm = null; }
    if (window._stopwatch) { clearInterval(window._stopwatch); window._stopwatch = null; }
    for (const [re, fn] of routes) {
      const m = hash.match(re);
      if (m) { app.innerHTML = '<div class="page muted">Loading…</div>'; await fn(...m.slice(1)); window.scrollTo(0, 0); return; }
    }
    app.innerHTML = '<div class="page">Not found.</div>';
  }
  window.addEventListener('hashchange', () => { currentRoute = null; render(); });

  const diffPill = (d) => `<span class="pill ${d.toLowerCase()}">${d}</span>`;
  const statusIcon = (s) => s === 'solved' ? '<span class="st-solved" title="Solved">✔</span>' : s === 'attempted' ? '<span class="st-attempted" title="Attempted">◔</span>' : '<span class="muted">·</span>';
  const companyChips = (c) => Object.entries(c || {}).filter(([, v]) => v >= 3).sort((a, b) => b[1] - a[1]).map(([k]) => `<span class="pill company ${k}">${k[0].toUpperCase() + k.slice(1)}</span>`).join('');

  // ---------- dashboard ----------
  route(/^\/$/, async () => {
    const [{ stats, reviews }, { problems }] = await Promise.all([api.get('/api/stats'), api.get('/api/problems')]);
    const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
    const d = stats.by_difficulty;
    const days = new Set(stats.active_days);
    let heat = '';
    for (let k = 89; k >= 0; k--) { const dt = new Date(); dt.setDate(dt.getDate() - k); const key = dt.toISOString().slice(0, 10); heat += `<i class="${days.has(key) ? 'on' : ''}" title="${key}"></i>`; }
    const next = problems.filter(p => p.status !== 'solved').slice(0, 5);
    app.innerHTML = `<div class="page">
      <h1>Dashboard</h1>
      <p class="lead">A practice platform modelled on the public LeetCode problem page: ${problems.length} problems written from scratch, a judge that runs your Python against hidden tests${STATIC ? ' right in this browser' : ''}, spaced-repetition reviews, an 8-week plan, and Google and Apple tracks.${STATIC ? ' Progress is saved in this browser only.' : ''}</p>
      <div class="grid cols-3">
        <div class="card"><div class="muted small">Solved</div><div class="stat">${stats.solved}<small>/ ${stats.total}</small></div>
          <div class="bar"><i style="width:${pct(stats.solved, stats.total)}%"></i></div>
          <div class="small muted" style="margin-top:8px">Easy ${d.Easy[0]}/${d.Easy[1]} · Medium ${d.Medium[0]}/${d.Medium[1]} · Hard ${d.Hard[0]}/${d.Hard[1]}</div>
          <div class="bar easy"><i style="width:${pct(d.Easy[0], d.Easy[1])}%"></i></div>
          <div class="bar medium"><i style="width:${pct(d.Medium[0], d.Medium[1])}%"></i></div>
          <div class="bar hard"><i style="width:${pct(d.Hard[0], d.Hard[1])}%"></i></div></div>
        <div class="card"><div class="muted small">Streak</div><div class="stat">${stats.streak}<small>days</small></div><div class="small muted" style="margin:8px 0">Last 90 days</div><div class="heat">${heat}</div></div>
        <div class="card"><div class="muted small">Reviews due</div><div class="stat">${reviews.length}</div>
          ${reviews.length ? '<ul class="plain small" style="margin:8px 0 0">' + reviews.slice(0, 6).map(r => `<li><a href="#/problem/${r.id}">${esc(r.title)}</a> <span class="muted">${r.due}</span></li>`).join('') + '</ul>' : '<div class="small muted" style="margin-top:8px">Nothing due. Solved problems come back after 1, 3, 7, 14, 30 and 60 days.</div>'}
        </div>
      </div>
      <div class="grid cols-2" style="margin-top:14px">
        <div class="card"><h2 style="margin-top:0">Up next</h2>
          <ul class="plain" style="padding-left:0;list-style:none">${next.map(p => `<li class="row" style="padding:4px 0">${statusIcon(p.status)} <a href="#/problem/${p.id}">${p.number}. ${esc(p.title)}</a> ${diffPill(p.difficulty)}</li>`).join('')}</ul>
          <div class="row" style="margin-top:10px"><a class="btn accent" href="#/plan">Open the 8-week plan</a><button class="btn" id="rand">Random unsolved</button></div></div>
        <div class="card"><h2 style="margin-top:0">Progress by pattern</h2>

      <div class="grid cols-2" style="margin-top:14px">
        <div class="card"><h2 style="margin-top:0">Tips from the loop</h2><ul class="plain">${t.tips.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
        <div class="card"><h2 style="margin-top:0">Pattern mix at ${esc(t.name)}</h2><div class="mix">${t.pattern_mix.map(m => `<span>${esc(m.pattern)}</span><div class="bar" style="margin:0"><i style="width:${Math.min(100, m.share * 2)}%"></i></div><span class="small muted">${m.share}%</span>`).join('')}</div></div>
      </div>
      <div class="row" style="margin:18px 0 6px"><h2 style="margin:0">Must do (${t.must_do.length})</h2><a class="btn sm" href="#/mock?company=${company}">Start a ${esc(t.name)} mock</a></div>
      <div class="card"><ul class="track-list">${t.must_do.map(li).join('')}</ul></div>
      <h2>Also frequently reported (${t.also.length})</h2>
      <div class="card"><ul class="track-list">${t.also.map(li).join('')}</ul></div>
    </div>`;
  });

  // ---------- mock interview ----------
  route(/^\/mock(?:\?company=(\w+))?$/, async (company) => {
    const mock = store.get('mock', null);
    const sel = company || (mock && mock.company) || 'google';
    app.innerHTML = `<div class="page">
      <h1>Mock interview</h1>
      <p class="lead">Two problems, 45 minutes, like a real loop round. Talk out loud, state the brute force, ask clarifying questions to yourself, and only run the code when you believe it is correct. No hints, no editorial until the timer ends.</p>
      <div class="card">
        <div class="row"><label>Style</label><select id="mock-company" class="btn"><option value="google" ${sel === 'google' ? 'selected' : ''}>Google (graphs, DP, follow-ups)</option><option value="apple" ${sel === 'apple' ? 'selected' : ''}>Apple (arrays, strings, lists, design)</option></select>
        <button class="btn primary" id="mock-start">Start new mock</button>${mock ? '<button class="btn" id="mock-end">End current mock</button>' : ''}</div>
        <div id="mock-body" style="margin-top:14px">${mock ? renderMock(mock) : '<p class="muted">No mock in progress.</p>'}</div>
      </div>
      <h2>Scoring yourself afterwards</h2>
      <div class="card"><ul class="plain">
        <li><b>Problem navigation:</b> Did you restate the problem and ask about constraints before coding?</li>
        <li><b>Algorithm:</b> Did you reach the optimal complexity, and say it out loud?</li>
        <li><b>Coding:</b> Would the code compile on the first try? Variable names clear? Edge cases handled?</li>
        <li><b>Verification:</b> Did you trace an example by hand before running?</li>
        <li><b>Communication:</b> Could an interviewer follow you without reading the code?</li>
      </ul></div>
    </div>`;
    function renderMock(m) {
      return `<div class="small muted">Started ${esc(new Date(m.started).toLocaleString())} · ${m.company} style</div><ul class="track-list">${m.problems.map(p => `<li><a href="#/problem/${p.id}">${p.number}. ${esc(p.title)}</a>${diffPill(p.difficulty)}<span class="small muted">${esc(p.pattern)}</span></li>`).join('')}</ul>`;
    }
    $('#mock-start').onclick = async () => {
      const c = $('#mock-company').value;
      const r = await api.get('/api/mock?company=' + c);
      const m = { company: c, problems: r.problems, started: Date.now(), minutes: r.minutes };
      store.set('mock', m); tickMock(); go('/problem/' + m.problems[0].id);
    };
    const end = $('#mock-end'); if (end) end.onclick = () => { store.set('mock', null); tickMock(); render(); };
  });

  function tickMock() {
    const el = document.getElementById('mock-timer');
    const m = store.get('mock', null);
    if (!m) { el.classList.add('hidden'); return; }
    const left = m.minutes * 60 * 1000 - (Date.now() - m.started);
    const s = Math.floor(Math.abs(left) / 1000);
    el.textContent = `${left < 0 ? '-' : ''}${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')} mock`;
    el.classList.toggle('late', left < 0); el.classList.remove('hidden');
    el.onclick = () => go('/mock');
  }
  setInterval(tickMock, 1000); tickMock();

  function $(sel) { return app.querySelector(sel); }
  render();
})();

</script>

</body></html>
